name: Linux CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.7"
  PYTHON_VERSION: "3.11.9"
  CMAKE_GENERATOR: Ninja
  NVIDIA_NVCC_VERSION: "12.9.86"

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out pinned LLVM
        run: git submodule update --init --depth 1 llvm-project

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libvulkan1 mesa-vulkan-drivers patchelf

      - name: Read LLVM revision
        id: llvm-revision
        run: echo "sha=$(git rev-parse HEAD:llvm-project)" >> "$GITHUB_OUTPUT"

      - name: Restore LLVM installation
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: llvm-project/install
          key: linux-${{ runner.arch }}-llvm-${{ steps.llvm-revision.outputs.sha }}-libdevice-${{ env.NVIDIA_NVCC_VERSION }}-v1

      - name: Install NVIDIA libdevice
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          uv pip install --target llvm-project/nvidia-nvcc \
            --no-cache "nvidia-cuda-nvcc-cu12==${NVIDIA_NVCC_VERSION}"
          echo "MLIR_NVVM_LIBDEVICE_PATH=$GITHUB_WORKSPACE/llvm-project/nvidia-nvcc/nvidia/cuda_nvcc/nvvm/libdevice/libdevice.10.bc" \
            >> "$GITHUB_ENV"

      - name: Build and install LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: >
          python scripts/configure_llvm.py
          --generator Ninja
          --cuda on
          --libdevice "$MLIR_NVVM_LIBDEVICE_PATH"
          --build
          --parallel 3

      - name: Install Python build environment
        run: uv sync --extra build --frozen

      - name: Configure VernonDSL
        run: >
          uv run --frozen cmake -S . -B build-ci
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMLIR_DIR="$GITHUB_WORKSPACE/llvm-project/install/lib/cmake/mlir"
          -DLLD_DIR="$GITHUB_WORKSPACE/llvm-project/install/lib/cmake/lld"
          -DPython_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
          -DVERNON_INSTALL_GIT_HOOK=OFF
          -DBUILD_TESTING=ON

      - name: Build VernonDSL tests
        run: cmake --build build-ci --parallel 3

      - name: Run C++ and integration tests
        run: ctest --test-dir build-ci --output-on-failure

      - name: Run Python tests
        env:
          PYTHONPATH: python
        run: uv run --frozen --no-sync pytest python/tests -q

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: build-ci/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 14

  compiler-wheel:
    name: Compiler and wheel (Python ${{ matrix.python-version }})
    needs: build-test
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out pinned LLVM
        run: git submodule update --init --depth 1 llvm-project

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build patchelf

      - name: Read LLVM revision
        id: llvm-revision
        run: echo "sha=$(git rev-parse HEAD:llvm-project)" >> "$GITHUB_OUTPUT"

      - name: Restore LLVM installation
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: llvm-project/install
          key: linux-${{ runner.arch }}-llvm-${{ steps.llvm-revision.outputs.sha }}-libdevice-${{ env.NVIDIA_NVCC_VERSION }}-v1

      - name: Install NVIDIA libdevice
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          uv pip install --target llvm-project/nvidia-nvcc \
            --no-cache "nvidia-cuda-nvcc-cu12==${NVIDIA_NVCC_VERSION}"
          echo "MLIR_NVVM_LIBDEVICE_PATH=$GITHUB_WORKSPACE/llvm-project/nvidia-nvcc/nvidia/cuda_nvcc/nvvm/libdevice/libdevice.10.bc" \
            >> "$GITHUB_ENV"

      - name: Build and install LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: >
          python scripts/configure_llvm.py
          --generator Ninja
          --cuda on
          --libdevice "$MLIR_NVVM_LIBDEVICE_PATH"
          --build
          --parallel 3

      - name: Install Python build environment
        run: uv sync --extra build --frozen

      - name: Build clean wheel
        run: uv build --wheel --no-cache

      - name: Repair wheel for manylinux
        run: |
          mkdir -p wheelhouse
          uvx --from auditwheel auditwheel repair dist/*.whl --wheel-dir wheelhouse

      - name: Validate wheel metadata
        run: uvx --from twine twine check wheelhouse/*.whl

      - name: Test wheel in a fresh environment
        run: |
          wheels=(wheelhouse/*.whl)
          wheel="${wheels[0]}"
          venv="$RUNNER_TEMP/vernon-wheel"
          uv venv "$venv" --python "${{ matrix.python-version }}"
          uv pip install --python "$venv/bin/python" --no-cache "$wheel"
          "$venv/bin/python" scripts/verify_installed_wheel.py

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: vernon-lang-linux-${{ runner.arch }}-python-${{ matrix.python-version }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Upload Compiler test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-compiler-wheel-logs-python-${{ matrix.python-version }}
          path: build/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 14
