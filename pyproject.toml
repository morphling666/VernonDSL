[project]
name = "vernon-lang"
dynamic = ["version"]
description = "General parallel compiler"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Xinyu Yuan", email = "1282503538@qq.com" }]

dependencies = [
    "numpy>=1.26,<2.0; python_version < '3.13'",
    "numpy>=2.1,<3.0; python_version >= '3.13'",
]

[project.optional-dependencies]
examples = ["opencv-python>=4.10"]
build = [
    "nanobind>=2.7.0",
    "clang-format==20.1.8",
    "cmakelang>=0.6.13",
    "pyyaml>=6.0.2",
    "ruff>=0.15.6",
    "pytest>=9.0.3",
    "coverage[toml]>=7.10",
]

[project.scripts]
vernon-compile-python = "vernon_dsl.cli:main"
vernon-cook-pipeline = "vernon_dsl.pipeline_asset_cli:main"

[tool.uv]
package = false

[build-system]
requires = [
    "scikit-build-core>=0.11",
    "nanobind>=2.7.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["python/vernon_dsl"]
cmake.build-type = "Release"
cmake.args = ["-DBUILD_TESTING=OFF"]
install.components = ["VernonWheel"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "python/vernon_dsl/_versions.py"
regex = 'RELEASE_VERSION = "(?P<value>[^"]+)"'

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"examples/blinn_phong.py" = ["F403", "F405"]
"examples/blinn_phong_vertices.py" = ["F403", "F405"]
"examples/planet_terrain.py" = ["F403", "F405"]
"examples/shader_lib/pbr.py" = ["F722", "F821"]
"examples/runtime_shader.py" = ["F403", "F405"]
"examples/shader_lib/shadow.py" = ["F403", "F405"]
"examples/shadowed_material.py" = ["F403", "F405"]
"python/tests/cube_map_shader.py" = ["F821"]
"python/tests/pipeline_asset_fixture.py" = ["F722"]
"python/tests/smoke_shader.py" = ["F403", "F405", "F841"]

[tool.coverage.run]
branch = true
source = ["python/vernon_dsl"]

[tool.coverage.report]
show_missing = true
skip_covered = true
