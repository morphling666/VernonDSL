[project]
name = "vernon-lang"
version = "0.1.0"
description = "General parallel compiler"
requires-python = ">=3.11.9,<3.12"
authors = [{ name = "Xinyu Yuan", email = "1282503538@qq.com" }]

dependencies = [
    "numpy>=1.26,<2.0",
]

[project.optional-dependencies]
examples = ["opencv-python>=4.10"]
build = [
    "nanobind>=2.7.0",
    "clang-format==20.1.8",
]

[project.scripts]
vernon-compile-python = "vernon_dsl.cli:main"
vernon-cook-shader = "vernon_dsl.shader_asset_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
